project:
  name: my-project

paths:
  # Path to the code repo, relative to this orch folder
  code_repo: ../my-project-code

trello:
  board_id: YOUR_BOARD_ID_HERE
  # Column names — adjust if your board uses different names
  columns:
    backlog: Backlog
    refining: Refined
    ready: Spec Ready
    executing: Coding
    review: Local Review
    pr: PR
    done: Done
    failed: Failure

model:
  orchestrator: claude-opus-4-7
  executor: claude-sonnet-4-6

quality_gates:
  - npm run lint
  - npm run typecheck
  - npm test
